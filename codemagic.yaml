workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Status Window'
    environment:
      ios_signing:
        # Автоматическая подпись: Codemagic сам забирает сертификат и
        # provisioning profile из Apple Developer Portal по ключу ASC,
        # указанному в integrations выше. Ручная загрузка файлов в UI не нужна.
        distribution_type: app_store
        bundle_identifier: com.emilsgailis.statuswindow
      vars:
        BUNDLE_ID: "com.emilsgailis.statuswindow"
        XCODE_WORKSPACE: "Status Window.xcodeproj"
        XCODE_SCHEME: "Status Window"
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
