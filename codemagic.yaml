workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Status Window'
    environment:
      vars:
        BUNDLE_ID: "com.emilsgailis.statuswindow"
        XCODE_WORKSPACE: "Status Window.xcodeproj"
        XCODE_SCHEME: "Status Window"
      xcode: latest
    scripts:
      # Блок ios_signing не используется: он резолвит профили из хранилища
      # Codemagic, а загрузить туда .mobileprovision невозможно — компонент
      # загрузки не принимает файлы. Вместо этого тянем сертификат и профили
      # прямо из Apple по ключу ASC, который интеграция выше кладёт в
      # переменные APP_STORE_CONNECT_*.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
