workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Status Window'
    environment:
      # Подпись берётся из хранилища Codemagic (Settings → Code signing
      # identities): там лежит distribution-сертификат «Status Window» вместе
      # с приватным ключом и подтянутые из портала provisioning profiles на
      # com.emilsgailis.statuswindow. Один сертификат обслуживает все сборки.
      #
      # Прежняя схема генерировала ключ заново на каждой сборке
      # (openssl genrsa) — сертификат оставался, а ключа к нему больше не
      # было, поэтому каждый запуск просил у Apple новый и упирался в лимит:
      # «You already have a current Distribution certificate», 409.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.emilsgailis.statuswindow
      vars:
        BUNDLE_ID: "com.emilsgailis.statuswindow"
        XCODE_WORKSPACE: "Status Window.xcodeproj"
        XCODE_SCHEME: "Status Window"
        APP_STORE_APPLE_ID: 6804669472
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
